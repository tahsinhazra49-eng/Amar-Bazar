<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>আমাদের বাজার - শপিং স্টোর</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
        .hidden-modal { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pt-28 pb-12">

    <!-- 1. APP-STYLE SMART HEADER (Scroll Down = Hide, Scroll Up = Show) -->
    <header id="mainHeader" class="fixed top-0 left-0 w-full z-50 bg-white/95 backdrop-blur-md shadow-sm border-b border-gray-100 transition-transform duration-300 ease-in-out">
        <div class="max-w-6xl mx-auto px-4 py-3 space-y-2">
            
            <!-- Top Bar: Logo & Actions -->
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <i class="fas fa-shopping-bag text-blue-600 text-2xl"></i>
                    <h1 class="text-xl font-black text-gray-900 tracking-tight">আমাদের বাজার</h1>
                </div>
                <div class="flex items-center gap-3">
                    <button class="relative p-2 text-gray-700 hover:text-blue-600 transition">
                        <i class="fas fa-shopping-cart text-xl"></i>
                        <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
                    </button>
                    <a href="admin.html" class="bg-gray-100 text-gray-700 p-2 rounded-xl text-sm font-bold hover:bg-blue-50 hover:text-blue-600 transition">
                        <i class="fas fa-user-shield"></i>
                    </a>
                </div>
            </div>

            <!-- Search Bar & Categories -->
            <div class="flex items-center gap-2">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="filterProducts()" placeholder="প্রোডাক্ট খুঁজুন..." class="w-full bg-gray-100 border-none rounded-2xl pl-9 pr-4 py-2 text-xs md:text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <select id="categoryFilter" onchange="filterProducts()" class="bg-gray-100 border-none rounded-2xl px-3 py-2 text-xs md:text-sm font-bold text-gray-700 focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="All">সব ক্যাটাগরি</option>
                    <option value="Cosmetics">পোশাক ও কসমেটিক্স</option>
                    <option value="Grocery">মুদি মাল</option>
                    <option value="Electronics">ইলেকট্রনিক্স</option>
                    <option value="Food">ফুড</option>
                </select>
            </div>

        </div>
    </header>

    <!-- 2. MAIN CONTENT AREA -->
    <main class="max-w-6xl mx-auto px-4 space-y-6">
        
        <!-- Offer Banner -->
        <div id="bannerContainer" class="hidden rounded-3xl overflow-hidden shadow-md border relative h-36 md:h-52 bg-cover bg-center">
            <div class="absolute inset-0 bg-gradient-to-r from-black/70 via-black/40 to-transparent flex items-center p-6">
                <h2 id="bannerTextDisplay" class="text-white text-lg md:text-2xl font-black max-w-md"></h2>
            </div>
        </div>

        <!-- Section Title -->
        <div class="flex items-center justify-between">
            <h2 class="text-lg md:text-xl font-extrabold text-gray-900 flex items-center gap-2">
                <i class="fas fa-fire text-orange-500"></i> সেরা প্রোডাক্টসমূহ
            </h2>
        </div>

        <!-- 3. PREMIUM PRODUCT GRID (4:5 Ratio Images + Curved Corners + Auto Text Height) -->
        <div id="userProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-5 md:gap-6">
            <p class="text-center text-gray-500 py-12 col-span-full font-bold">প্রোডাক্ট লোড হচ্ছে...</p>
        </div>

    </main>

    <!-- Firebase Configuration & Dynamic Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // admin.html থেকে নেওয়া ফায়ারবেস কনফিগারেশন[cite: 1]
        const firebaseConfig = {
          apiKey: "AIzaSyATb9iSNj0IKGiyNJvAIRZf2qwdeL6AvMw",
          authDomain: "test-93b32.firebaseapp.com",
          projectId: "test-93b32",
          storageBucket: "test-93b32.firebasestorage.app",
          messagingSenderId: "712531589314",
          appId: "1:712531589314:web:10f52459acce159d92e35b",
          measurementId: "G-9XDH6Q09T0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let allProducts = [];

        // ১. অটো-হাইডিং অ্যাপ-স্টাইল স্মার্ট নেভিগেশন Script
        let lastScrollTop = 0;
        const mainHeader = document.getElementById("mainHeader");

        window.addEventListener("scroll", () => {
            let currentScroll = window.pageYOffset || document.documentElement.scrollTop;
            
            // নিচে স্ক্রোল করলে হেডার লুকিয়ে যাবে
            if (currentScroll > lastScrollTop && currentScroll > 60) {
                mainHeader.style.transform = "translateY(-100%)";
            } 
            // উপরে স্ক্রোল করলে হেডার সাথে সাথে ভেসে উঠবে
            else {
                mainHeader.style.transform = "translateY(0)";
            }
            lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
        });

        // ২. লোড ব্যানার
        async function loadBanner() {
            try {
                const snap = await getDocs(collection(db, "offers"));
                if(!snap.empty) {
                    const data = snap.docs[0].data();
                    const container = document.getElementById("bannerContainer");
                    container.style.backgroundImage = `url('${data.imageUrl}')`;
                    document.getElementById("bannerTextDisplay").innerText = data.text;
                    container.classList.remove("hidden");
                }
            } catch(e) { console.error(e); }
        }

        // ৩. লোড ও রেন্ডার প্রোডাক্টস
        async function loadProducts() {
            try {
                const snap = await getDocs(collection(db, "products"));
                allProducts = [];
                snap.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));
                renderProducts(allProducts);
            } catch(e) {
                console.error(e);
                document.getElementById("userProductsGrid").innerHTML = `<p class="col-span-full text-center text-red-500 font-bold">প্রোডাক্ট লোড করতে সমস্যা হয়েছে।</p>`;
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById("userProductsGrid");
            grid.innerHTML = "";

            if(products.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center py-10 text-gray-500 font-bold">কোনো প্রোডাক্ট পাওয়া যায়নি।</p>`;
                return;
            }

            products.forEach(p => {
                grid.innerHTML += `
                    <!-- প্রিমিয়াম কার্ভড প্রোডাক্ট কার্ড (rounded-3xl) -->
                    <div class="bg-white rounded-3xl border border-gray-200/80 shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col justify-between">
                        
                        <!-- ৪:৫ অ্যাসপেক্ট রেশিও ডিসপ্লে ফ্রেম (মোবাইলে বড় ও পারফেক্ট শট) -->
                        <div class="w-full aspect-[4/5] bg-gray-100 overflow-hidden relative group">
                            <img src="${p.imageUrl}" class="w-full h-full object-cover rounded-t-3xl transition duration-500 group-hover:scale-105" alt="${p.name}">
                            
                            ${!p.inStock ? '<span class="absolute top-3 left-3 bg-red-600 text-white text-[10px] font-black px-3 py-1 rounded-full shadow-md">OUT OF STOCK</span>' : ''}
                            
                            <span class="absolute top-3 right-3 bg-black/60 backdrop-blur-md text-white text-[10px] font-bold px-2.5 py-1 rounded-full border border-white/20 uppercase">
                                ${p.category || 'General'}
                            </span>
                        </div>

                        <!-- অটো-এডজাস্টিং টেক্সট কন্টেইনার (কখনো টেক্সট কাটবে না) -->
                        <div class="p-5 flex flex-col flex-1 justify-between space-y-3 h-auto">
                            <div class="space-y-2">
                                <!-- প্রোডাক্ট নেম (অটো লাইন ব্রেক) -->
                                <h3 class="font-extrabold text-gray-900 text-base md:text-lg leading-snug break-words">
                                    ${p.name}
                                </h3>

                                <!-- প্রোডাক্ট কোয়ালিটি ট্যাগ -->
                                ${p.quality ? `
                                    <div class="inline-block bg-blue-50 text-blue-700 text-xs font-bold px-3 py-1 rounded-xl border border-blue-200/60 break-words">
                                        <i class="fas fa-check-circle text-blue-500 mr-1"></i>${p.quality}
                                    </div>
                                ` : ''}

                                <!-- প্রোডাক্ট ডিটেইলস (যত বড়ই হোক সম্পূর্ণ জায়গা নিবে) -->
                                ${p.description ? `
                                    <p class="text-xs text-gray-600 leading-relaxed break-words whitespace-pre-line pt-1">
                                        ${p.description}
                                    </p>
                                ` : ''}
                            </div>

                            <!-- প্রাইস ও অর্ডার অ্যাকশন -->
                            <div class="pt-3 border-t border-gray-100 flex items-center justify-between mt-auto">
                                <div>
                                    <span class="text-xl font-black text-blue-600">৳${p.price}</span>
                                    ${p.oldPrice ? `<span class="text-xs text-gray-400 line-through ml-1.5 font-bold">৳${p.oldPrice}</span>` : ''}
                                </div>
                                <button onclick="alert('অর্ডার সাবমিট ফর্ম চালু হচ্ছে...')" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold px-4 py-2.5 rounded-2xl text-xs shadow-md shadow-blue-500/20 active:scale-95 transition flex items-center gap-1.5">
                                    <i class="fas fa-shopping-bag"></i> অর্ডার করুন
                                </button>
                            </div>
                        </div>

                    </div>
                `;
            });
        }

        // ফিল্টারিং ফাংশন
        window.filterProducts = () => {
            const search = document.getElementById("searchInput").value.toLowerCase();
            const cat = document.getElementById("categoryFilter").value;

            const filtered = allProducts.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(search) || (p.description && p.description.toLowerCase().includes(search));
                const matchCat = cat === "All" || p.category === cat;
                return matchSearch && matchCat;
            });

            renderProducts(filtered);
        };

        // প্রারম্ভিক ডাটা লোড
        loadBanner();
        loadProducts();
    </script>
</body>
</html>
